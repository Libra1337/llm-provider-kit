[package]
name = "llm-provider-kit"
version = "0.1.0"
license = "Apache-2.0"
authors = ["LynShen Innovations INC."]
edition = "2021"
description = "Multi-provider LLM wire protocols, provider catalog, provider templates, and provider logins"

[dependencies]
base64 = "0.22"
getrandom = "0.2"
serde_json = "1"
sha2 = "0.10"
# The Responses WebSocket mode (`websocket`). Already in the LynShen CLI's
# build through its daemon, with the same TLS (rustls, ring, webpki roots).
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
